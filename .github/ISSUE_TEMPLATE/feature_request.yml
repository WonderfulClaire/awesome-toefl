name: "💡 功能 / 内容建议"
description: 新功能、新章节、资源补充建议
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在有什么不便或缺失？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你的建议
      description: 希望增加 / 改动什么？
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充
      description: 参考链接、截图等
