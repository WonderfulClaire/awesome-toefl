<!DOCTYPE html>
<!--
  coach.html —— 单文件网页版 AI 备考陪练（双击即用，无需安装任何东西）

  · 提示词库自动从仓库的 ai-toolkit.md 加载（文档即数据，与 CLI 同源）
  · 接你自己的大模型 API Key（DeepSeek / Kimi / 通义 / GLM / OpenAI）
  · Key 只保存在你浏览器的 localStorage，不会发往任何第三方
  · 若某平台浏览器跨域受限，请改用 tools/ai_coach.py 终端版
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 备考陪练</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a212b; --border: #2c3644;
    --text: #e6edf3; --dim: #8b98a5; --accent: #4c9aff; --user: #1f3a5f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; }
  select, input, button, textarea {
    background: #0d1117; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; font-size: 14px;
  }
  input:focus, textarea:focus, select:focus { outline: 1px solid var(--accent); }
  button { cursor: pointer; background: var(--accent); border: 0; color: #04121f; font-weight: 600; }
  button.ghost { background: transparent; color: var(--dim); border: 1px solid var(--border); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #chat { flex: 1; overflow-y: auto; padding: 18px; }
  .msg { max-width: 850px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: var(--user); border: 1px solid #2a5490; }
  .msg.ai { background: var(--panel); border: 1px solid var(--border); }
  .msg.sys { background: transparent; color: var(--dim); font-size: 13px; text-align: center; border: 0; }
  footer { padding: 12px 16px; background: var(--panel); border-top: 1px solid var(--border); }
  .inputrow { max-width: 850px; margin: 0 auto; display: flex; gap: 8px; }
  #box { flex: 1; resize: vertical; min-height: 44px; max-height: 220px; }
  .hint { max-width: 850px; margin: 6px auto 0; color: var(--dim); font-size: 12px; }
  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; max-width: 460px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog label { display: block; margin: 12px 0 4px; color: var(--dim); font-size: 13px; }
  dialog input, dialog select { width: 100%; }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>

<header>
  <h1>🤖 AI 备考陪练</h1>
  <select id="modeSel" title="训练模式"><option>加载提示词库中…</option></select>
  <button class="ghost" id="btnNew">新对话</button>
  <button class="ghost" id="btnReview">复盘</button>
  <button class="ghost" id="btnCfg">⚙ 接口设置</button>
</header>

<div id="chat"></div>

<footer>
  <div class="inputrow">
    <textarea id="box" placeholder="输入内容…（Enter 发送，Shift+Enter 换行；作文可整段粘贴）"></textarea>
    <button id="btnSend">发送</button>
  </div>
  <div class="hint">Key 只存在你自己的浏览器里 · 「考试政策」类信息请认准 ETS 官网 · 跨域报错请改用终端版 ai_coach.py</div>
</footer>

<dialog id="cfg">
  <h3 style="margin:4px 0">接口设置</h3>
  <label>服务商预设</label>
  <select id="provider">
    <option value="https://api.deepseek.com/v1|deepseek-chat">DeepSeek（deepseek-chat）</option>
    <option value="https://api.moonshot.cn/v1|kimi-latest">Kimi（kimi-latest）</option>
    <option value="https://dashscope.aliyuncs.com/compatible-mode/v1|qwen-plus">通义千问（qwen-plus）</option>
    <option value="https://open.bigmodel.cn/api/paas/v4|glm-4-flash">智谱 GLM（glm-4-flash）</option>
    <option value="https://api.openai.com/v1|gpt-4o-mini">OpenAI（gpt-4o-mini）</option>
    <option value="custom">自定义…</option>
  </select>
  <label>接口地址（OpenAI 兼容 base URL）</label>
  <input id="baseUrl" placeholder="https://api.deepseek.com/v1">
  <label>模型名</label>
  <input id="model" placeholder="deepseek-chat">
  <label>API Key（仅保存在本机浏览器）</label>
  <input id="apiKey" type="password" placeholder="sk-...">
  <label>考生档案（会作为 system 提示贯穿对话，建议认真填）</label>
  <input id="profile" placeholder="目标 100 分；模考 88，听力最弱；距考试 6 周，每天 2 小时">
  <div class="row">
    <button class="ghost" id="btnCfgCancel">取消</button>
    <button id="btnCfgSave">保存</button>
  </div>
</dialog>

<script>
"use strict";

/* ======================= 配置（复制到其他仓库时改这两行） ======================= */
const REPO = "awesome-toefl";
const DOC_PATH = "docs/07-ai-prep/ai-toolkit.md";
/* ============================================================================ */

const $ = (id) => document.getElementById(id);
const store = {
  get: (k, d = "") => localStorage.getItem("coach." + k) ?? d,
  set: (k, v) => localStorage.setItem("coach." + k, v),
};

let modes = [];          // [{num, title, prompt}]
let profileTemplate = "";
let examName = "备考";
let messages = [];       // OpenAI 格式对话
let busy = false;

/* ---------- 加载提示词库：先试相对路径（本地/Pages），再退回 GitHub raw ---------- */
async function loadToolkit() {
  const candidates = [
    "../" + DOC_PATH,
    `https://raw.githubusercontent.com/WonderfulClaire/${REPO}/main/${DOC_PATH}`,
  ];
  for (const url of candidates) {
    try {
      const res = await fetch(url);
      if (res.ok) return parseToolkit(await res.text());
    } catch (_) { /* 尝试下一个来源 */ }
  }
  addMsg("sys", "⚠ 提示词库加载失败（本地打开需联网拉取 GitHub）。仍可用「自由对话」模式。");
  fillModeSelect();
}

function parseToolkit(md) {
  md = md.replace(/\r\n/g, "\n");  // 归一化 Windows 换行符，否则正则匹配不到代码块
  const title = md.match(/^#\s+\S*\s*(.+)$/m);
  if (title) examName = title[1].trim();
  const prof = md.match(/##\s+第 0 步[^\n]*\n[\s\S]*?```text\n([\s\S]*?)```/);
  if (prof) profileTemplate = prof[1].trim();
  modes = [];
  const re = /###\s+(\d+)\.\s+([^\n]+)\n+```text\n([\s\S]*?)```/g;
  for (let m; (m = re.exec(md)); ) {
    modes.push({ num: +m[1], title: m[2].replace(/（[^）]*）/g, "").trim(), prompt: m[3].trim() });
  }
  modes.sort((a, b) => a.num - b.num);
  fillModeSelect();
  addMsg("sys", `已加载「${examName}」提示词库，共 ${modes.length} 个训练模式。选择模式即开练；首次使用请先点右上角「⚙ 接口设置」。`);
}

function fillModeSelect() {
  const sel = $("modeSel");
  sel.innerHTML = '<option value="0">💬 自由对话</option>' +
    modes.map((m) => `<option value="${m.num}">${m.num}. ${m.title}</option>`).join("");
  sel.value = "0";
}

/* --------------------------------- 界面 --------------------------------- */
function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = text;
  $("chat").appendChild(div);
  $("chat").scrollTop = $("chat").scrollHeight;
  return div;
}

function systemPrompt() {
  let sp = `你是${examName}的私人教练。\n` +
    `【考生档案】${store.get("profile") || "（考生未填写，请先摸底了解水平）"}\n` +
    "对话要求：出题难度贴近但略高于考生水平；批改和讲解直说问题、不要客套和夸奖；" +
    "所有反馈先讲最伤分的那一条。\n" +
    "错题账本：考生每答错一次，你就默默记下【题型｜错误原因】；" +
    "当考生说「复盘」时，输出完整账本 + 归纳出的 2–3 个错误模式；账本为空时如实说明。\n" +
    "考试政策类问题一律回答「请以 ETS 官网为准」，不要编造。";
  if (profileTemplate) sp += "\n（档案格式参考：）\n" + profileTemplate;
  return sp;
}

function resetChat(keepNotice) {
  messages = [{ role: "system", content: systemPrompt() }];
  if (!keepNotice) addMsg("sys", "已重开对话（考生档案保留）。");
}

/* ------------------------------ 调用大模型 ------------------------------ */
async function send(text) {
  if (busy) return;
  const baseUrl = store.get("baseUrl"), apiKey = store.get("apiKey"), model = store.get("model");
  if (!baseUrl || !apiKey || !model) { $("cfg").showModal(); return; }
  if (!messages.length) resetChat(true);

  busy = true; $("btnSend").disabled = true;
  addMsg("user", text);
  messages.push({ role: "user", content: text });
  const bubble = addMsg("ai", "…");

  try {
    const res = await fetch(baseUrl.replace(/\/$/, "") + "/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + apiKey },
      body: JSON.stringify({ model, messages, stream: true }),
    });
    if (!res.ok) {
      const body = (await res.text()).slice(0, 300);
      throw new Error(`HTTP ${res.status} ${body}${res.status === 401 ? "（检查 API Key）" : ""}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let reply = "", pending = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      pending += decoder.decode(value, { stream: true });
      const lines = pending.split("\n");
      pending = lines.pop();
      for (const raw of lines) {
        const line = raw.trim();
        if (!line.startsWith("data:")) continue;
        const payload = line.slice(5).trim();
        if (payload === "[DONE]") continue;
        try {
          const piece = JSON.parse(payload).choices?.[0]?.delta?.content ?? "";
          if (piece) { reply += piece; bubble.textContent = reply; $("chat").scrollTop = $("chat").scrollHeight; }
        } catch (_) { /* 忽略不完整分片 */ }
      }
    }
    if (reply) messages.push({ role: "assistant", content: reply });
    else { bubble.textContent = "（空回复，请重试）"; messages.pop(); }
  } catch (err) {
    bubble.textContent = "⚠ 请求失败：" + err.message +
      "\n若是跨域（CORS/Failed to fetch）问题，该平台不支持浏览器直连，请改用终端版 tools/ai_coach.py。";
    messages.pop();
  } finally {
    busy = false; $("btnSend").disabled = false;
  }
}

/* -------------------------------- 事件绑定 -------------------------------- */
$("modeSel").addEventListener("change", () => {
  const num = +$("modeSel").value;
  resetChat(true);
  if (num === 0) { addMsg("sys", "自由对话模式。"); return; }
  const mode = modes.find((m) => m.num === num);
  addMsg("sys", `已加载模式：${mode.title}（提示词中的 {占位符} 请在对话里补充具体内容）`);
  send(mode.prompt);
});

$("btnSend").addEventListener("click", () => {
  const text = $("box").value.trim();
  if (!text) return;
  $("box").value = "";
  send(text);
});
$("box").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("btnSend").click(); }
});
$("btnNew").addEventListener("click", () => resetChat(false));
$("btnReview").addEventListener("click", () => send("复盘"));

/* 设置弹窗 */
$("btnCfg").addEventListener("click", () => {
  $("baseUrl").value = store.get("baseUrl");
  $("model").value = store.get("model");
  $("apiKey").value = store.get("apiKey");
  $("profile").value = store.get("profile");
  $("cfg").showModal();
});
$("provider").addEventListener("change", () => {
  const v = $("provider").value;
  if (v === "custom") return;
  const [url, model] = v.split("|");
  $("baseUrl").value = url; $("model").value = model;
});
$("btnCfgSave").addEventListener("click", () => {
  store.set("baseUrl", $("baseUrl").value.trim());
  store.set("model", $("model").value.trim());
  store.set("apiKey", $("apiKey").value.trim());
  store.set("profile", $("profile").value.trim());
  $("cfg").close();
  resetChat(true);
  addMsg("sys", "设置已保存（仅存于本机浏览器）。选择训练模式开始吧！");
});
$("btnCfgCancel").addEventListener("click", () => $("cfg").close());

loadToolkit();
</script>
</body>
</html>
